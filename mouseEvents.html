<!DOCTYPE html>
<html>
<head>
<title>All Mouse Events</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    text-align: center;
    padding-top: 40px;
}

#box {
    width: 250px;
    height: 250px;
    background: #64748b;
    color: white;
    margin: auto;
    line-height: 250px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 10px;
}

#msg {
    margin-top: 20px;
    font-size: 16px;
    color: #1e293b;
}
</style>
</head>

<body>

<h2>Mouse Events Mini Project</h2>

<div id="box"
    onclick="clickEvent()"
    ondblclick="dblClickEvent()"
    onmouseover="mouseOverEvent()"
    onmouseout="mouseOutEvent()"
    onmousedown="mouseDownEvent()"
    onmouseup="mouseUpEvent()"
    onmousemove="mouseMoveEvent()">
    Mouse Box
</div>

<p id="msg">Perform mouse actions on the box</p>

<script>
function clickEvent() {
    document.getElementById("msg").innerHTML = "Mouse Clicked";
}

function dblClickEvent() {
    document.getElementById("msg").innerHTML = "Mouse Double Clicked";
}

function mouseOverEvent() {
    document.getElementById("box").style.background = "#2563eb";
    document.getElementById("msg").innerHTML = "Mouse Over";
}

function mouseOutEvent() {
    document.getElementById("box").style.background = "#64748b";
    document.getElementById("msg").innerHTML = "Mouse Out";
}

function mouseDownEvent() {
    document.getElementById("msg").innerHTML = "Mouse Button Pressed";
}

function mouseUpEvent() {
    document.getElementById("msg").innerHTML = "Mouse Button Released";
}

function mouseMoveEvent() {
    document.getElementById("msg").innerHTML = "Mouse Moving...";
}
</script>

</body>
</html>
